plugins {
    id 'java'
    id 'gg.essential.loom' version '0.10.0.+'
    id 'dev.architectury.architectury-pack200' version '0.1.3'
}

group = 'valor'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

loom {
    forge {
        pack200Provider = new dev.architectury.pack200.java.Pack200Adapter()
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net/' }
    maven { url = 'https://repo.spongepowered.org/maven/' }
    maven { url = 'https://repo.essential.gg/repository/maven-public/' }
}

configurations {
    includeInJar
    compileClasspath.extendsFrom(includeInJar)
}

dependencies {
    minecraft 'com.mojang:minecraft:1.8.9'
    mappings 'de.oceanlabs.mcp:mcp_stable:22-1.8.9'
    forge 'net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9'
    includeInJar 'net.java.dev.jna:jna:4.4.0'
    includeInJar 'net.java.dev.jna:jna-platform:4.4.0'
}

jar {
    manifest {
        attributes(
            'Premain-Class': 'valor.agent.ValorAgent',
            'Agent-Class': 'valor.agent.ValorAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true',
            'Main-Class': 'valor.agent.ValorAgent'
        )
    }
}

remapJar {
    archiveClassifier = 'forge-rt'
}

task remapNotchJar(type: net.fabricmc.loom.task.RemapJarTask, dependsOn: jar) {
    input = jar.archiveFile
    archiveClassifier = 'notch'
    toM = 'official'
}

task agentJar(type: Copy) {
    dependsOn remapJar, remapNotchJar
    from jar.archiveFile
    into layout.buildDirectory.dir("libs")
    rename { String fileName -> "valor-${project.version}.jar" }
}

task universalJar(type: Jar) {
    dependsOn remapJar, remapNotchJar, agentJar
    archiveClassifier = 'universal'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            'Premain-Class': 'valor.agent.ValorAgent',
            'Agent-Class': 'valor.agent.ValorAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true',
            'Main-Class': 'valor.agent.ValorAgent'
        )
    }
    from(zipTree(jar.archiveFile)) {
        include 'valor/agent/**'
        include 'valor/launcher/**'
        include 'valor/asm/**'
        include 'valor/transformer/**'
        include 'valor_injector.dll'
        include 'assets/**'
        include 'callback.html'
        include 'ssl.jks'
        include 'version.json'
        exclude 'valor/agent/ValorRunnable*.class'
    }
    from {
        configurations.includeInJar.collect { zipTree(it) }
    }
    into('runtimes') {
        from remapJar.archiveFile
        rename { 'valor-forge.jar' }
    }
    into('runtimes') {
        from file('src/main/resources/runtimes/valor-notch.jar')
        rename { 'valor-notch.jar' }
    }
    into('runtimes') {
        from jar.archiveFile
        rename { 'valor-mcp.jar' }
    }
}

assemble.dependsOn(universalJar)
build.dependsOn(assemble)

task buildNative {
    group = 'build'
    description = 'Compiles the native injector DLL using CMake'
    onlyIf {
        System.getProperty('os.name').toLowerCase().contains('windows')
    }
    doLast {
        try {
            exec {
                workingDir 'native'
                commandLine 'cmake', '-B', 'build'
            }
            exec {
                workingDir 'native'
                commandLine 'cmake', '--build', 'build', '--config', 'Release'
            }
        } catch (Exception e) {
            logger.warn("Native build skipped or failed: " + e.message)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
